                    "primary-container": "#10b981",

                    "on-surface": "#191c1e",
                    "primary-fixed": "#6ffbbe",

                    "tertiary-fixed-dim": "#ffb95f",
                    "inverse-primary": "#4edea3",
                    "on-tertiary-fixed-variant": "#653e00",
                    "secondary-fixed": "#d8e2ff",
                    "on-tertiary-fixed": "#2a1700",
                    "secondary-container": "#2170e4",

            },
            "borderRadius": {

            },
            "fontFamily": {
                    "display-lg": ["Plus Jakarta Sans"],
                    "body-md": ["Nunito Sans"],

                    "label-lg": ["Nunito Sans"],

            },
            "fontSize": {
                    "body-md": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],

                    "label-lg": ["16px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "700"}],
                    "display-lg": ["40px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        
        .correct-pulse {
            animation: pulse-emerald 0.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse-emerald {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
        }

        .shake {
            animation: shake-error 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake-error {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid #E2E8F0;
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col overflow-hidden">
<!-- Top Navigation Bar (Linear Interaction Suppression - Manual Creation as per task rules) -->
<nav class="fixed top-0 left-0 w-full h-20 px-gutter flex items-center justify-between z-40 bg-white/80 backdrop-blur-md">
<div class="flex items-center gap-4 flex-1">
<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white font-bold">
<span class="material-symbols-outlined">school</span>
</div>
<div class="hidden md:block">
<p class="font-headline-md text-primary leading-tight">Biologi Kelas 8</p>
<p class="font-label-lg text-on-surface-variant">Sistem Pernapasan Manusia</p>
</div>
</div>
<div class="flex-1 flex flex-col items-center gap-2">
<div class="w-full max-w-md bg-surface-container rounded-full h-3 overflow-hidden">
<div class="bg-primary-container h-full w-[30%] rounded-full transition-all duration-700 ease-out"></div>
</div>
<span class="font-label-lg text-primary">Scene 3 / 10</span>
</div>
<div class="flex-1 flex justify-end items-center gap-4">
<div class="flex items-center gap-2 bg-secondary/10 px-4 py-2 rounded-full border border-secondary/20">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-headline-md text-secondary">Skor: 850</span>
</div>
<button class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
</nav>
<!-- Main Authoring Canvas / Quiz Container -->
<main class="flex-grow flex flex-col items-center justify-center pt-24 pb-32 px-gutter">
<div class="w-full max-w-5xl">
<!-- Question Section -->
<div class="text-center mb-12 animate-in fade-in slide-in-from-bottom-4 duration-700">
<h1 class="font-fredoka text-[48px] md:text-[56px] text-on-background leading-tight mb-4 tracking-tight">
                    Manakah organ yang berfungsi sebagai tempat <span class="text-primary underline decoration-primary-container/50 underline-offset-8">pertukaran oksigen?</span>
</h1>
<p class="text-on-surface-variant text-xl">Pilihlah salah satu jawaban yang paling tepat!</p>
</div>
<!-- Answer Grid (Asymmetric/Modern Layout) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
<!-- Option A -->
<button class="group relative glass-card p-8 rounded-[24px] text-left transition-all duration-300 hover:-translate-y-2 hover:border-primary/50 hover:bg-white active:scale-95 flex items-center gap-6" onclick="handleChoice(this, false)">
<div class="w-16 h-16 rounded-2xl bg-surface-container-high flex items-center justify-center text-2xl font-bold text-on-surface-variant group-hover:bg-primary/10 group-hover:text-primary transition-colors">A</div>
<div>
<span class="block font-fredoka text-3xl text-on-surface">Laring</span>
</div>
</button>
<!-- Option B (Correct) -->
<button class="group relative glass-card p-8 rounded-[24px] text-left transition-all duration-300 hover:-translate-y-2 hover:border-primary/50 hover:bg-white active:scale-95 flex items-center gap-6" onclick="handleChoice(this, true)">
<div class="w-16 h-16 rounded-2xl bg-surface-container-high flex items-center justify-center text-2xl font-bold text-on-surface-variant group-hover:bg-primary/10 group-hover:text-primary transition-colors">B</div>
<div>
<span class="block font-fredoka text-3xl text-on-surface">Alveolus</span>
</div>
</button>
<!-- Option C -->
<button class="group relative glass-card p-8 rounded-[24px] text-left transition-all duration-300 hover:-translate-y-2 hover:border-primary/50 hover:bg-white active:scale-95 flex items-center gap-6" onclick="handleChoice(this, false)">
<div class="w-16 h-16 rounded-2xl bg-surface-container-high flex items-center justify-center text-2xl font-bold text-on-surface-variant group-hover:bg-primary/10 group-hover:text-primary transition-colors">C</div>
<div>
<span class="block font-fredoka text-3xl text-on-surface">Bronkus</span>
</div>
</button>
<!-- Option D -->
<button class="group relative glass-card p-8 rounded-[24px] text-left transition-all duration-300 hover:-translate-y-2 hover:border-primary/50 hover:bg-white active:scale-95 flex items-center gap-6" onclick="handleChoice(this, false)">
<div class="w-16 h-16 rounded-2xl bg-surface-container-high flex items-center justify-center text-2xl font-bold text-on-surface-variant group-hover:bg-primary/10 group-hover:text-primary transition-colors">D</div>
<div>
<span class="block font-fredoka text-3xl text-on-surface">Trakea</span>
</div>
</button>
</div>
</div>
</main>
<!-- Bottom Scene Navigator -->
<footer class="fixed bottom-0 left-0 w-full h-24 flex items-center justify-center bg-transparent pointer-events-none">
<div class="flex items-center gap-4 bg-white/90 backdrop-blur-xl px-8 py-4 rounded-full border border-outline-variant/30 shadow-lg pointer-events-auto">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<div class="flex gap-3 px-4">
<div class="w-3 h-3 rounded-full bg-primary/20"></div>
<div class="w-3 h-3 rounded-full bg-primary/20"></div>
<div class="w-8 h-3 rounded-full bg-primary"></div>
<div class="w-3 h-3 rounded-full bg-surface-container-highest"></div>
<div class="w-3 h-3 rounded-full bg-surface-container-highest"></div>
<div class="w-3 h-3 rounded-full bg-surface-container-highest"></div>
<div class="w-3 h-3 rounded-full bg-surface-container-highest"></div>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</footer>
<!-- Atmosphere & Background Elements -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40">
<div class="absolute top-[10%] left-[5%] w-[400px] h-[400px] bg-primary/10 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[10%] right-[5%] w-[500px] h-[500px] bg-secondary/10 rounded-full blur-[120px]"></div>
</div>
<!-- Feedback Modal/Overlay (Hidden by default) -->
<div class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300" id="feedback-overlay">
<div class="absolute inset-0 bg-white/40 backdrop-blur-sm"></div>
<div class="relative glass-card p-12 rounded-[40px] text-center transform scale-90 transition-transform duration-500" id="feedback-card">
<div class="w-24 h-24 rounded-full mx-auto mb-6 flex items-center justify-center text-5xl" id="feedback-icon-container">
<span class="material-symbols-outlined text-6xl" id="feedback-icon"></span>
</div>
<h2 class="font-fredoka text-5xl mb-2" id="feedback-title"></h2>
<p class="text-xl text-on-surface-variant mb-8" id="feedback-text"></p>
<button class="bg-primary text-white font-bold py-4 px-12 rounded-full text-xl hover:scale-105 transition-transform" onclick="closeFeedback()">Pertanyaan Berikutnya</button>
</div>
</div>
<script>
        function handleChoice(element, isCorrect) {
            const allButtons = document.querySelectorAll('button[onclick^="handleChoice"]');
            allButtons.forEach(btn => btn.style.pointerEvents = 'none');

            if (isCorrect) {
                element.classList.add('bg-primary-container', 'border-primary', 'correct-pulse');
                element.querySelector('.w-16').classList.replace('bg-surface-container-high', 'bg-white');
                element.querySelector('.w-16').classList.add('text-primary');
                
                showFeedback(true);
            } else {
                element.classList.add('shake', 'border-error', 'bg-error-container/20');
                element.querySelector('.w-16').classList.replace('bg-surface-container-high', 'bg-error-container');
                element.querySelector('.w-16').classList.add('text-error');
                
                // Highlight the correct one after a delay
                setTimeout(() => {
                    showFeedback(false);
                }, 800);
            }
        }

        function showFeedback(isCorrect) {
            const overlay = document.getElementById('feedback-overlay');
            const card = document.getElementById('feedback-card');
            const icon = document.getElementById('feedback-icon');
            const iconContainer = document.getElementById('feedback-icon-container');
            const title = document.getElementById('feedback-title');
            const text = document.getElementById('feedback-text');

            if (isCorrect) {
                icon.textContent = 'check_circle';
                iconContainer.className = 'w-24 h-24 rounded-full mx-auto mb-6 flex items-center justify-center text-white bg-primary-container';
                title.textContent = 'Luar Biasa!';
                title.className = 'font-fredoka text-5xl mb-2 text-primary';
                text.textContent = 'Kamu benar! Alveolus adalah kantung udara tempat pertukaran gas.';
            } else {
                icon.textContent = 'cancel';
                iconContainer.className = 'w-24 h-24 rounded-full mx-auto mb-6 flex items-center justify-center text-white bg-error';
                title.textContent = 'Ayo Coba Lagi!';
                title.className = 'font-fredoka text-5xl mb-2 text-error';
                text.textContent = 'Jawaban yang benar adalah Alveolus. Semangat belajar!';
            }

            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100', 'pointer-events-auto');
            card.classList.remove('scale-90');
            card.classList.add('scale-100');
        }

        function closeFeedback() {
            const overlay = document.getElementById('feedback-overlay');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlay.classList.remove('opacity-100', 'pointer-events-auto');
            
            // Reset page for next (simulation)
            setTimeout(() => {
                location.reload();
            }, 300);
        }
    </script>
</body></html>
