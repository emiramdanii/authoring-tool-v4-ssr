<body class="bg-background text-on-surface font-body-md overflow-x-hidden">
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
        const { useState } = React;

        const SidebarItem = ({ icon, label, active, onClick }) => (
            <a 
                href="#" 
                onClick={onClick}
                className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 hover:translate-x-1 ${
                    active 
                    ? 'bg-primary-container text-on-primary-container' 
                    : 'text-on-surface-variant hover:bg-surface-container-high'
                }`}
            >
                <span className="material-symbols-outlined">{icon}</span>
                <span className="font-label-lg">{label}</span>
            </a>
        );

        const NavButton = ({ id, label, active, onClick }) => (
            <button 
                className={`text-left px-6 py-4 rounded-xl font-label-lg transition-all duration-300 ${
                    active 
                    ? 'bg-primary text-on-primary border-b-2 border-[#005236]' 
                    : 'text-on-surface-variant hover:bg-surface-container-low'
                }`}
                onClick={() => onClick(id)}
            >
                {label}
            </button>
        );

        const ProfileSection = () => (

                <div className="bg-surface-container-lowest border border-outline-variant rounded-[24px] p-gutter">
                    <h3 className="font-headline-md text-on-surface mb-stack-md">Personal Information</h3>
                    <div className="flex items-center gap-gutter mb-gutter">
                        <div className="relative group">
                            <img 
                                className="w-32 h-32 rounded-full object-cover border-4 border-primary-container"

                                <span className="material-symbols-outlined text-sm">edit</span>
                            </button>
                        </div>
                        <div>
                            <h4 className="font-label-lg text-on-surface">Profile Picture</h4>
                            <p className="text-on-surface-variant text-sm max-w-xs">PNG or JPG. Maximum 2MB. A clear photo helps students recognize you.</p>
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-stack-md">
                        <div className="space-y-2">
                            <label className="font-label-lg text-on-surface-variant">Full Name</label>
                            <input 
                                className="w-full bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl px-4 py-3 font-body-md transition-all" 
                                type="text" 
                                defaultValue="Ibu Budi"
                            />
                        </div>
                        <div className="space-y-2">
                            <label className="font-label-lg text-on-surface-variant">Email Address</label>
                            <input 
                                className="w-full bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl px-4 py-3 font-body-md transition-all" 
                                type="email" 
                                defaultValue="ibu.budi@smpedu.id"
                            />
                        </div>
                        <div className="col-span-2 space-y-2">
                            <label className="font-label-lg text-on-surface-variant">Professional Bio</label>
                            <textarea 
                                className="w-full bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl px-4 py-3 font-body-md transition-all" 
                                rows="3"
                                defaultValue="Grade 8 Mathematics Teacher at SMP Education Portal. Passionate about interactive lesson authoring and gamified learning experiences."
                            />
                        </div>
                    </div>
                </div>
            </section>
        );

        const BrandingSection = () => (
            <section className="animate-fade-in space-y-gutter">
                <div className="bg-surface-container-lowest border border-outline-variant rounded-[24px] p-gutter">
                    <h3 className="font-headline-md text-on-surface mb-stack-md">Institutional Identity</h3>
                    <div className="grid grid-cols-1 gap-gutter">
                        <div className="space-y-2">
                            <label className="font-label-lg text-on-surface-variant">Institution Name</label>
                            <input className="w-full bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-xl px-4 py-3 font-body-md" type="text" defaultValue="SMP Education Portal"/>

                        <div className="flex items-start gap-gutter p-gutter bg-surface-container-low rounded-[24px]">

                            </div>
                            <div>
                                <h4 className="font-label-lg text-on-surface">Institution Logo</h4>

                                <button className="bg-white border-2 border-outline-variant text-on-surface px-4 py-2 rounded-full font-label-lg hover:bg-surface-container-high transition-colors">
                                    Upload New Logo
                                </button>
                            </div>
                        </div>
                        <div className="space-y-4">
                            <label className="font-label-lg text-on-surface-variant">Brand Colors</label>
                            <div className="flex gap-4">
                                <div className="group cursor-pointer">
                                    <div className="w-12 h-12 rounded-full bg-primary border-4 border-surface-container-highest"></div>
                                    <p className="text-center text-xs mt-1 font-bold">Primary</p>
                                </div>
                                <div className="group cursor-pointer">
                                    <div className="w-12 h-12 rounded-full bg-secondary border-4 border-surface-container-lowest"></div>
                                    <p className="text-center text-xs mt-1">Secondary</p>
                                </div>
                                <div className="group cursor-pointer">
                                    <div className="w-12 h-12 rounded-full bg-tertiary border-4 border-surface-container-lowest"></div>
                                    <p className="text-center text-xs mt-1">Accent</p>
                                </div>
                                <button className="w-12 h-12 rounded-full border-2 border-dashed border-outline flex items-center justify-center text-outline-variant hover:border-primary hover:text-primary transition-all">
                                    <span className="material-symbols-outlined">add</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        );

        const IntegrationsSection = () => (

                <div className="bg-surface-container-lowest border border-outline-variant rounded-[24px] p-gutter">
                    <div className="flex justify-between items-center mb-stack-md">
                        <h3 className="font-headline-md text-on-surface">Learning Management Systems</h3>
                        <span className="bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Cloud Sync Active</span>

                            { name: 'Google Classroom', icon: 'hub', color: '#F4B400', status: 'CONNECTED', sync: '2 hours ago' },
                            { name: 'Canvas LMS', icon: 'art_track', color: '#E03E2D', status: 'CONFIGURE', sync: 'Not configured' },
                            { name: 'Moodle', icon: 'dynamic_feed', color: '#F98012', status: 'CONFIGURE', sync: 'Not configured' }
                        ].map((lms, idx) => (

        const SubscriptionSection = () => (
            <section className="animate-fade-in space-y-gutter">

                    <div className="absolute -top-12 -right-12 w-48 h-48 bg-primary opacity-10 rounded-full blur-3xl"></div>
                    <div className="absolute -bottom-12 -left-12 w-48 h-48 bg-secondary opacity-10 rounded-full blur-3xl"></div>
                    <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-gutter">
                        <div>
                            <div className="flex items-center gap-2 mb-2">
                                <span className="material-symbols-outlined text-primary fill-current">stars</span>
                                <span className="font-bold text-primary tracking-widest text-xs uppercase">Premium AI Plan</span>
                            </div>
                            <h3 className="font-display-lg text-on-surface leading-tight mb-2">Powering Your Creativity</h3>

                        <div className="text-right">

                    </div>
                    <div className="mt-8 pt-8 border-t border-outline-variant grid grid-cols-1 md:grid-cols-3 gap-stack-md">

                                <span className="font-label-lg text-sm">{feat}</span>
                            </div>

                            <div className="w-12 h-8 bg-on-background rounded flex items-center justify-center">
                                <span className="text-white text-[10px] font-bold">VISA</span>
                            </div>
                            <div>
                                <p className="font-label-lg">Visa ending in •••• 4242</p>
                                <p className="text-xs text-on-surface-variant">Expires 12/28</p>
                            </div>
                        </div>
                        <button className="text-primary font-label-lg hover:underline">Update</button>
                    </div>
                </div>
            </section>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('profile');

            const renderContent = () => {
                switch(activeTab) {
                    case 'profile': return <ProfileSection />;
                    case 'branding': return <BrandingSection />;
                    case 'integrations': return <IntegrationsSection />;
                    case 'subscription': return <SubscriptionSection />;
                    default: return <ProfileSection />;
                }
            };

            return (
                <div className="flex">
                    <aside className="fixed left-0 top-0 h-full w-64 bg-surface-bright flex flex-col p-4 border-r border-outline-variant z-50">
                        <div className="mb-8 px-2">

                            <p className="font-label-lg text-on-surface-variant opacity-70">SMP Education Portal</p>

                        <nav className="flex flex-col gap-2 flex-grow">
                            <SidebarItem icon="dashboard" label="Dashboard" />
                            <SidebarItem icon="edit_note" label="Workspace" />
                            <SidebarItem icon="folder_open" label="Assets" />
                            <SidebarItem icon="analytics" label="Analytics" />
                        </nav>
                        <div className="mt-auto border-t border-outline-variant pt-4 flex flex-col gap-2">
                            <SidebarItem icon="settings" label="Settings" active={true} />
                            <SidebarItem icon="contact_support" label="Support" />
                            <div className="mt-4 flex items-center gap-3 px-2 py-2">
                                <img 
                                    alt="Teacher Profile" 
                                    className="w-10 h-10 rounded-full object-cover" 
                                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUhlN_7WVO9cl6iKuX8yar8M93hsmBUX4uLE2iMP0IA13wYz9LtF2FpqMZq9pggSHdYXuBf0IOyVN-A8EatS6iCiIxsjlv--l64cXitr21HHa7NCFKyav75B1KpU3kJA3VK3q-eXYzOL_3yNleQMCYb9wt-Qw2_J5pMXoFOKH0Jc0tjFA8wcFvEUaeCkL8TWlDxu19SyJ8FIUBWRKXcdP79VTCXPydNNkzOu5--Yo3Qxgfcf4oOdpOg2QZUBbvmVMxCqd5ePaXeBk2"
                                />
                                <div>
                                    <p className="font-label-lg text-on-surface leading-tight">Ibu Budi</p>
                                    <span className="text-xs text-primary font-bold">Premium Author</span>
                                </div>
                            </div>
                        </div>

                    <main className="ml-64 min-h-screen p-container-padding flex-grow">

                                <h2 className="font-headline-lg text-headline-lg text-on-surface">Settings</h2>
                                <p className="font-body-md text-on-surface-variant">Manage your account, institutional branding, and integrations.</p>
                            </div>
                            <div className="flex items-center gap-stack-sm">
                                <button className="bg-surface-container-high text-on-surface-variant px-6 py-2.5 rounded-full font-label-lg hover:bg-surface-container-highest transition-colors">

                                <button className="bg-primary text-on-primary px-8 py-2.5 rounded-full font-label-lg border-b-2 border-[#005236] hover:scale-[1.02] transition-transform flex items-center gap-2">
                                    Save Changes
                                </button>
                            </div>
                        </header>

                        <div className="flex gap-section-gap">
                            <nav className="w-64 flex flex-col gap-4 sticky top-container-padding h-fit">
                                <NavButton id="profile" label="Teacher Profile" active={activeTab === 'profile'} onClick={setActiveTab} />
                                <NavButton id="branding" label="Institutional Branding" active={activeTab === 'branding'} onClick={setActiveTab} />
                                <NavButton id="integrations" label="LMS Integrations" active={activeTab === 'integrations'} onClick={setActiveTab} />

                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body></html>
