      tailwind.config = {

          extend: {
            "colors": {
                    "surface-variant": "#e0e3e5",
                    "primary-fixed-dim": "#4edea3",
                    "surface-bright": "#f7f9fb",

                    "surface-container-low": "#f2f4f6",

                    "surface-dim": "#d8dadc",
                    "on-error-container": "#93000a",
                    "surface-container-highest": "#e0e3e5",
                    "on-primary": "#ffffff",
                    "on-secondary-fixed-variant": "#004395",
                    "primary": "#006c49",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-container": "#fefcff",
                    "tertiary": "#855300",
                    "inverse-on-surface": "#eff1f3",
                    "surface-container": "#eceef0",
                    "on-secondary-fixed": "#001a42",
                    "secondary-fixed-dim": "#adc6ff",
                    "error-container": "#ffdad6",
                    "surface-container-high": "#e6e8ea",

                    "on-primary-fixed": "#002113",
                    "on-surface-variant": "#3c4a42",
                    "on-secondary": "#ffffff",
                    "on-tertiary-container": "#523200",
                    "inverse-surface": "#2d3133",
                    "primary-container": "#10b981",
                    "surface-tint": "#006c49",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#191c1e",
                    "primary-fixed": "#6ffbbe",
                    "outline-variant": "#bbcabf",
                    "tertiary-fixed-dim": "#ffb95f",
                    "inverse-primary": "#4edea3",
                    "on-tertiary-fixed-variant": "#653e00",
                    "secondary-fixed": "#d8e2ff",
                    "on-tertiary-fixed": "#2a1700",

            },
            "borderRadius": {

            "fontFamily": {

            }
          },

      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        
        .correct-pulse {
            animation: pulse-emerald 0.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse-emerald {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
        }

        .shake {
            animation: shake-error 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake-error {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid #E2E8F0;
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col overflow-hidden">
<div id="root"></div>
<!-- React Implementation Emulation -->
<script crossorigin="" src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin="" src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = ({ currentScene, totalScenes, score }) => (
            <nav className="fixed top-0 left-0 w-full h-20 px-gutter flex items-center justify-between z-40 bg-white/80 backdrop-blur-md">
                <div className="flex items-center gap-4 flex-1">
                    <div className="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white font-bold">
                        <span className="material-symbols-outlined">school</span>
                    </div>
                    <div className="hidden md:block">
                        <p className="font-headline-md text-primary leading-tight">Biologi Kelas 8</p>
                        <p className="font-label-lg text-on-surface-variant">Sistem Pernapasan Manusia</p>
                    </div>
                </div>
                <div className="flex-1 flex flex-col items-center gap-2">
                    <div className="w-full max-w-md bg-surface-container rounded-full h-3 overflow-hidden">
                        <div 
                            className="bg-primary-container h-full rounded-full transition-all duration-700 ease-out"
                            style={{ width: `${(currentScene / totalScenes) * 100}%` }}
                        ></div>
                    </div>
                    <span className="font-label-lg text-primary">Scene {currentScene} / {totalScenes}</span>
                </div>
                <div className="flex-1 flex justify-end items-center gap-4">
                    <div className="flex items-center gap-2 bg-secondary/10 px-4 py-2 rounded-full border border-secondary/20">
                        <span className="material-symbols-outlined text-secondary" style={{ fontVariationSettings: "'FILL' 1" }}>stars</span>
                        <span className="font-headline-md text-secondary">Skor: {score}</span>
                    </div>
                    <button className="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center hover:bg-surface-container-highest transition-colors">
                        <span className="material-symbols-outlined text-on-surface-variant">close</span>
                    </button>
                </div>
            </nav>
        );

        const ChoiceCard = ({ label, text, isCorrect, onSelect, status }) => {
            const getStatusClasses = () => {
                if (status === 'correct') return 'bg-primary-container border-primary correct-pulse';
                if (status === 'wrong') return 'shake border-error bg-error-container/20';
                return 'hover:-translate-y-2 hover:border-primary/50 hover:bg-white active:scale-95';
            };

            const getLabelClasses = () => {
                if (status === 'correct') return 'bg-white text-primary';
                if (status === 'wrong') return 'bg-error-container text-error';
                return 'bg-surface-container-high text-on-surface-variant group-hover:bg-primary/10 group-hover:text-primary';
            };

            return (
                <button 
                    className={`group relative glass-card p-8 rounded-[24px] text-left transition-all duration-300 flex items-center gap-6 ${getStatusClasses()}`}
                    onClick={() => onSelect()}
                    disabled={status !== null}
                >
                    <div className={`w-16 h-16 rounded-2xl flex items-center justify-center text-2xl font-bold transition-colors ${getLabelClasses()}`}>
                        {label}
                    </div>
                    <div>
                        <span className="block font-fredoka text-3xl text-on-surface">{text}</span>
                    </div>
                </button>
            );
        };

        const Footer = ({ currentScene, totalScenes }) => (
            <footer className="fixed bottom-0 left-0 w-full h-24 flex items-center justify-center bg-transparent pointer-events-none">
                <div className="flex items-center gap-4 bg-white/90 backdrop-blur-xl px-8 py-4 rounded-full border border-outline-variant/30 shadow-lg pointer-events-auto">
                    <button className="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors">
                        <span className="material-symbols-outlined">chevron_left</span>
                    </button>
                    <div className="flex gap-3 px-4">
                        {[...Array(totalScenes)].map((_, i) => (
                            <div 
                                key={i}
                                className={`h-3 rounded-full transition-all duration-300 ${
                                    i + 1 === currentScene 
                                    ? 'w-8 bg-primary' 
                                    : i + 1 < currentScene ? 'w-3 bg-primary/20' : 'w-3 bg-surface-container-highest'
                                }`}
                            ></div>
                        ))}
                    </div>
                    <button className="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container transition-colors">
                        <span className="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            </footer>
        );

        const FeedbackModal = ({ show, isCorrect, onClose }) => {
            if (!show) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center">
                    <div className="absolute inset-0 bg-white/40 backdrop-blur-sm animate-in fade-in duration-300"></div>
                    <div className="relative glass-card p-12 rounded-[40px] text-center transform scale-100 transition-transform duration-500 shadow-2xl">
                        <div className={`w-24 h-24 rounded-full mx-auto mb-6 flex items-center justify-center text-white text-5xl ${isCorrect ? 'bg-primary-container' : 'bg-error'}`}>
                            <span className="material-symbols-outlined text-6xl">
                                {isCorrect ? 'check_circle' : 'cancel'}
                            </span>
                        </div>
                        <h2 className={`font-fredoka text-5xl mb-2 ${isCorrect ? 'text-primary' : 'text-error'}`}>
                            {isCorrect ? 'Luar Biasa!' : 'Ayo Coba Lagi!'}
                        </h2>
                        <p className="text-xl text-on-surface-variant mb-8 max-w-md">
                            {isCorrect 
                                ? 'Kamu benar! Alveolus adalah kantung udara tempat pertukaran gas.' 
                                : 'Jawaban yang benar adalah Alveolus. Semangat belajar!'}
                        </p>
                        <button 
                            className="bg-primary text-white font-bold py-4 px-12 rounded-full text-xl hover:scale-105 transition-transform"
                            onClick={onClose}
                        >
                            Pertanyaan Berikutnya
                        </button>
                    </div>
                </div>
            );
        };

        const QuizApp = () => {
            const [selectedId, setSelectedId] = useState(null);
            const [showFeedback, setShowFeedback] = useState(false);
            const [isCorrect, setIsCorrect] = useState(false);

            const options = [
                { id: 'A', text: 'Laring', correct: false },
                { id: 'B', text: 'Alveolus', correct: true },
                { id: 'C', text: 'Bronkus', correct: false },
                { id: 'D', text: 'Trakea', correct: false }
            ];

            const handleSelect = (option) => {
                setSelectedId(option.id);
                setIsCorrect(option.correct);
                
                if (option.correct) {
                    setTimeout(() => setShowFeedback(true), 600);
                } else {
                    setTimeout(() => setShowFeedback(true), 800);
                }
            };

            const handleClose = () => {
                setShowFeedback(false);
                setSelectedId(null);
                // Simulation: in a real app, logic for next question would go here
            };

            return (
                <>
                    <Navbar currentScene={3} totalScenes={10} score={850} />
                    
                    <main className="flex-grow flex flex-col items-center justify-center pt-24 pb-32 px-gutter">
                        <div className="w-full max-w-5xl">
                            <div className="text-center mb-12 animate-in fade-in slide-in-from-bottom-4 duration-700">
                                <h1 className="font-fredoka text-[48px] md:text-[56px] text-on-background leading-tight mb-4 tracking-tight">
                                    Manakah organ yang berfungsi sebagai tempat <span className="text-primary underline decoration-primary-container/50 underline-offset-8">pertukaran oksigen?</span>
                                </h1>
                                <p className="text-on-surface-variant text-xl">Pilihlah salah satu jawaban yang paling tepat!</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                                {options.map(opt => (
                                    <ChoiceCard 
                                        key={opt.id}
                                        label={opt.id}
                                        text={opt.text}
                                        isCorrect={opt.correct}
                                        status={selectedId === opt.id ? (opt.correct ? 'correct' : 'wrong') : null}
                                        onSelect={() => handleSelect(opt)}
                                    />
                                ))}
                            </div>
                        </div>
                    </main>

                    <Footer currentScene={3} totalScenes={10} />

                    <div className="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40">
                        <div className="absolute top-[10%] left-[5%] w-[400px] h-[400px] bg-primary/10 rounded-full blur-[100px]"></div>
                        <div className="absolute bottom-[10%] right-[5%] w-[500px] h-[500px] bg-secondary/10 rounded-full blur-[120px]"></div>
                    </div>

                    <FeedbackModal 
                        show={showFeedback} 
                        isCorrect={isCorrect} 
                        onClose={handleClose} 
                    />
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuizApp />);
    </script>
</body></html>
